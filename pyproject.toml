[project]
name = "flask-chatbot"
version = "0.1.0"
description = "Chatbot that curates Spotify playlists using the OpenAI API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "flask>=3.1.1",
    "openai",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "spotipy>=2.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The code lives in `app/` and `config.py`, not in a `flask_chatbot` package
only-include = ["app", "config.py"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = "."

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-flask>=1.3.0",
    "ruff>=0.12.4",
]
